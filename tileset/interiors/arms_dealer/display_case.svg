<svg xmlns="http://www.w3.org/2000/svg" width="70" height="50" viewBox="0 0 70 50">
  <!-- The glass case the dealer sells over: sized to the counter collider already in the scene,
       and no wider, so the dealer behind it is not hidden by his own shop. -->
  <rect x="0" y="0" width="70" height="6" fill="#8d5f39"/>
  <rect x="0" y="6" width="70" height="4" fill="#3c2d20"/>
  <rect x="3" y="10" width="64" height="24" fill="#2e3a40"/>
  <rect x="7" y="14" width="56" height="16" fill="#41525a"/>
  <polygon points="10,30 10,18 24,14 34,14 18,30" fill="#55696f"/>
  <g fill="#c9a227">
    <rect x="13" y="21" width="20" height="4"/><rect x="30" y="19" width="6" height="8"/>
    <rect x="42" y="21" width="18" height="4"/>
  </g>
  <rect x="3" y="34" width="64" height="16" fill="#4a3728"/>
  <g fill="#3c2d20">
    <rect x="24" y="34" width="5" height="16"/><rect x="46" y="34" width="5" height="16"/>
  </g>
  <rect x="0" y="46" width="70" height="4" fill="#2b2119"/>
</svg>
