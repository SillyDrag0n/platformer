<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540">
  <!-- The arms dealer's shop. Game coords: x = sx - 500, y = sy - 270; floor at sy 400 (y 130).
       Dark boards, a smith's soot-stained back wall, and a stone floor that will not burn. -->
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b0b0e"/>
      <stop offset="1" stop-color="#1d1d23"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e7cd9c"/>
      <stop offset="1" stop-color="#c99356"/>
    </linearGradient>
    <linearGradient id="soot" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#111116" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#111116" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15151a" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#15151a" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e0e12" stop-opacity="0"/>
      <stop offset="1" stop-color="#0e0e12" stop-opacity="0.6"/>
    </linearGradient>
  </defs>

  <!-- roof void with heavy beams -->
  <rect x="0" y="0" width="1000" height="118" fill="url(#roof)"/>
  <g fill="#2c2c34">
    <rect x="0" y="72" width="1000" height="14"/>
    <rect x="110" y="0" width="18" height="72"/><rect x="430" y="0" width="18" height="72"/>
    <rect x="750" y="0" width="18" height="72"/>
  </g>
  <g fill="#23232a">
    <polygon points="110,20 210,72 192,72 110,30"/>
    <polygon points="128,20 28,72 46,72 128,30"/>
    <polygon points="430,20 530,72 512,72 430,30"/>
    <polygon points="448,20 348,72 366,72 448,30"/>
    <polygon points="750,20 850,72 832,72 750,30"/>
    <polygon points="768,20 668,72 686,72 768,30"/>
  </g>
  <rect x="0" y="112" width="1000" height="12" fill="#3a3a44"/>

  <!-- hanging tools rail under the beams -->
  <rect x="0" y="124" width="1000" height="6" fill="#4a4a52"/>

  <!-- board wall, sooted toward the ceiling -->
  <rect x="0" y="130" width="1000" height="270" fill="#43434e"/>
  <g fill="#3a3a44">
    <rect x="0" y="176" width="1000" height="5"/><rect x="0" y="222" width="1000" height="5"/>
    <rect x="0" y="268" width="1000" height="5"/><rect x="0" y="314" width="1000" height="5"/>
  </g>
  <g fill="#4f4f5b">
    <rect x="160" y="130" width="8" height="270"/><rect x="480" y="130" width="8" height="270"/>
    <rect x="800" y="130" width="8" height="270"/>
  </g>
  <rect x="0" y="130" width="1000" height="80" fill="url(#soot)"/>

  <!-- shuttered window, high up and small -->
  <rect x="596" y="176" width="110" height="80" fill="#2b2b33"/>
  <rect x="604" y="184" width="94" height="64" fill="url(#pane)"/>
  <rect x="646" y="184" width="10" height="64" fill="#2b2b33"/>
  <rect x="604" y="212" width="94" height="7" fill="#2b2b33"/>
  <rect x="590" y="168" width="122" height="10" fill="#5c3d28"/>
  <rect x="590" y="254" width="122" height="10" fill="#5c3d28"/>

  <!-- timber dado -->
  <rect x="0" y="330" width="1000" height="8" fill="#6b4527"/>
  <rect x="0" y="338" width="1000" height="62" fill="#4a3728"/>
  <g fill="#3c2d20">
    <rect x="80" y="338" width="6" height="62"/><rect x="200" y="338" width="6" height="62"/>
    <rect x="320" y="338" width="6" height="62"/><rect x="440" y="338" width="6" height="62"/>
    <rect x="560" y="338" width="6" height="62"/><rect x="680" y="338" width="6" height="62"/>
    <rect x="800" y="338" width="6" height="62"/><rect x="920" y="338" width="6" height="62"/>
  </g>
  <rect x="0" y="392" width="1000" height="8" fill="#2b2119"/>

  <!-- flagstone floor -->
  <rect x="0" y="400" width="1000" height="140" fill="#565058"/>
  <g fill="#4a4550">
    <rect x="0" y="400" width="120" height="36"/><rect x="132" y="400" width="150" height="36"/>
    <rect x="294" y="400" width="130" height="36"/><rect x="436" y="400" width="160" height="36"/>
    <rect x="608" y="400" width="140" height="36"/><rect x="760" y="400" width="120" height="36"/>
    <rect x="892" y="400" width="108" height="36"/>
    <rect x="40" y="444" width="160" height="44"/><rect x="212" y="444" width="140" height="44"/>
    <rect x="364" y="444" width="170" height="44"/><rect x="546" y="444" width="150" height="44"/>
    <rect x="708" y="444" width="160" height="44"/><rect x="880" y="444" width="120" height="44"/>
    <rect x="0" y="496" width="140" height="44"/><rect x="152" y="496" width="170" height="44"/>
    <rect x="334" y="496" width="150" height="44"/><rect x="496" y="496" width="180" height="44"/>
    <rect x="688" y="496" width="150" height="44"/><rect x="850" y="496" width="150" height="44"/>
  </g>
  <rect x="0" y="400" width="1000" height="30" fill="url(#floorFade)"/>
  <rect x="0" y="452" width="1000" height="88" fill="url(#bottomFade)"/>
</svg>
