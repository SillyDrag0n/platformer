<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540">
  <!-- Rosa's saloon. Game coords: x = sx - 500, y = sy - 270. Floor surface at sy 400 (y 130),
       upstairs landing at sy 250 (y -20), roof void above sy 112. -->
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160e08"/>
      <stop offset="1" stop-color="#2a1d12"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a1a0f" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#2a1a0f" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="wallFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0f08" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1a0f08" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#160d07" stop-opacity="0"/>
      <stop offset="1" stop-color="#160d07" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- roof void -->
  <rect x="0" y="0" width="1000" height="112" fill="url(#roof)"/>
  <polygon points="0,86 1000,86 1000,100 0,100" fill="#2a1d13"/>
  <rect x="150" y="0" width="16" height="90" fill="#241811"/>
  <rect x="500" y="0" width="16" height="90" fill="#241811"/>
  <rect x="840" y="0" width="16" height="90" fill="#241811"/>
  <g fill="#2f2115">
    <polygon points="150,30 260,86 240,86 150,40"/>
    <polygon points="166,30 56,86 76,86 166,40"/>
    <polygon points="500,30 610,86 590,86 500,40"/>
    <polygon points="516,30 406,86 426,86 516,40"/>
    <polygon points="840,30 950,86 930,86 840,40"/>
    <polygon points="856,30 746,86 766,86 856,40"/>
  </g>

  <!-- upper storey: papered wall, guest room doors, landing rail -->
  <rect x="0" y="100" width="1000" height="150" fill="#5b2f28"/>
  <rect x="0" y="100" width="1000" height="150" fill="url(#wallFade)"/>
  <g fill="#6b3a31">
    <rect x="40" y="112" width="6" height="138"/><rect x="140" y="112" width="6" height="138"/>
    <rect x="240" y="112" width="6" height="138"/><rect x="340" y="112" width="6" height="138"/>
    <rect x="440" y="112" width="6" height="138"/><rect x="540" y="112" width="6" height="138"/>
    <rect x="640" y="112" width="6" height="138"/><rect x="740" y="112" width="6" height="138"/>
    <rect x="840" y="112" width="6" height="138"/><rect x="940" y="112" width="6" height="138"/>
  </g>
  <g>
    <rect x="160" y="140" width="76" height="110" fill="#33220f"/>
    <rect x="166" y="146" width="64" height="104" fill="#5a3a22"/>
    <rect x="176" y="156" width="44" height="40" fill="#4a2e1a"/>
    <rect x="176" y="204" width="44" height="40" fill="#4a2e1a"/>
    <circle cx="224" cy="200" r="4" fill="#c9a227"/>
    <rect x="440" y="140" width="76" height="110" fill="#33220f"/>
    <rect x="446" y="146" width="64" height="104" fill="#5a3a22"/>
    <rect x="456" y="156" width="44" height="40" fill="#4a2e1a"/>
    <rect x="456" y="204" width="44" height="40" fill="#4a2e1a"/>
    <circle cx="504" cy="200" r="4" fill="#c9a227"/>
    <rect x="720" y="140" width="76" height="110" fill="#33220f"/>
    <rect x="726" y="146" width="64" height="104" fill="#5a3a22"/>
    <rect x="736" y="156" width="44" height="40" fill="#4a2e1a"/>
    <rect x="736" y="204" width="44" height="40" fill="#4a2e1a"/>
    <circle cx="784" cy="200" r="4" fill="#c9a227"/>
  </g>

  <!-- landing floor slab and its balustrade -->
  <rect x="0" y="238" width="1000" height="12" fill="#6b4527"/>
  <rect x="0" y="250" width="1000" height="10" fill="#33220f"/>
  <rect x="0" y="196" width="1000" height="8" fill="#7a5230"/>
  <g fill="#5c3b22">
    <rect x="20" y="204" width="8" height="34"/><rect x="60" y="204" width="8" height="34"/>
    <rect x="100" y="204" width="8" height="34"/><rect x="140" y="204" width="8" height="34"/>
    <rect x="180" y="204" width="8" height="34"/><rect x="220" y="204" width="8" height="34"/>
    <rect x="260" y="204" width="8" height="34"/><rect x="300" y="204" width="8" height="34"/>
    <rect x="340" y="204" width="8" height="34"/><rect x="380" y="204" width="8" height="34"/>
    <rect x="420" y="204" width="8" height="34"/><rect x="460" y="204" width="8" height="34"/>
    <rect x="500" y="204" width="8" height="34"/><rect x="540" y="204" width="8" height="34"/>
    <rect x="580" y="204" width="8" height="34"/><rect x="620" y="204" width="8" height="34"/>
    <rect x="660" y="204" width="8" height="34"/><rect x="700" y="204" width="8" height="34"/>
    <rect x="740" y="204" width="8" height="34"/><rect x="780" y="204" width="8" height="34"/>
    <rect x="820" y="204" width="8" height="34"/><rect x="860" y="204" width="8" height="34"/>
    <rect x="900" y="204" width="8" height="34"/><rect x="940" y="204" width="8" height="34"/>
    <rect x="980" y="204" width="8" height="34"/>
  </g>

  <!-- ground storey wall: planks, chair rail, wainscot -->
  <rect x="0" y="260" width="1000" height="140" fill="#523726"/>
  <g fill="#3f2a1d">
    <rect x="0" y="276" width="1000" height="3"/><rect x="0" y="294" width="1000" height="3"/>
    <rect x="0" y="312" width="1000" height="3"/><rect x="0" y="330" width="1000" height="3"/>
  </g>
  <rect x="0" y="260" width="1000" height="30" fill="url(#wallFade)"/>
  <rect x="0" y="336" width="1000" height="8" fill="#71492b"/>
  <rect x="0" y="344" width="1000" height="56" fill="#5a3b26"/>
  <g fill="#4a3020">
    <rect x="40" y="344" width="5" height="56"/><rect x="120" y="344" width="5" height="56"/>
    <rect x="200" y="344" width="5" height="56"/><rect x="280" y="344" width="5" height="56"/>
    <rect x="360" y="344" width="5" height="56"/><rect x="440" y="344" width="5" height="56"/>
    <rect x="520" y="344" width="5" height="56"/><rect x="600" y="344" width="5" height="56"/>
    <rect x="680" y="344" width="5" height="56"/><rect x="760" y="344" width="5" height="56"/>
    <rect x="840" y="344" width="5" height="56"/><rect x="920" y="344" width="5" height="56"/>
  </g>
  <rect x="0" y="390" width="1000" height="10" fill="#33210f"/>

  <!-- floor plane, running toward the viewer -->
  <rect x="0" y="400" width="1000" height="140" fill="#835730"/>
  <rect x="0" y="400" width="1000" height="6" fill="#a06c3f"/>
  <g fill="#63421f">
    <rect x="0" y="430" width="1000" height="4"/>
    <rect x="0" y="474" width="1000" height="4"/>
    <rect x="76" y="400" width="4" height="140"/><rect x="228" y="400" width="4" height="140"/>
    <rect x="392" y="400" width="4" height="140"/><rect x="548" y="400" width="4" height="140"/>
    <rect x="704" y="400" width="4" height="140"/><rect x="868" y="400" width="4" height="140"/>
  </g>
  <rect x="0" y="400" width="1000" height="34" fill="url(#floorFade)"/>
  <rect x="0" y="452" width="1000" height="88" fill="url(#bottomFade)"/>
</svg>
