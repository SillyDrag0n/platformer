<svg xmlns="http://www.w3.org/2000/svg" width="140" height="92" viewBox="0 0 140 92">
  <!-- Hangs from the underside of the landing, so the chain is short and the candles clear a
       standing head by a good margin. The glow is baked in - no light node needed. -->
  <defs>
    <radialGradient id="cglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffcf7a" stop-opacity="0.42"/>
      <stop offset="0.5" stop-color="#ffbe5c" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#ff9e3c" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <circle cx="70" cy="52" r="70" fill="url(#cglow)"/>
  <rect x="67" y="0" width="6" height="22" fill="#3a2c1c"/>
  <ellipse cx="70" cy="76" rx="52" ry="9" fill="#63421f"/>
  <ellipse cx="70" cy="72" rx="52" ry="9" fill="#8d5f39"/>
  <ellipse cx="70" cy="72" rx="34" ry="5" fill="#4a3020"/>
  <rect x="20" y="66" width="6" height="6" fill="#4a3020"/>
  <rect x="114" y="66" width="6" height="6" fill="#4a3020"/>
  <g>
    <rect x="24" y="54" width="8" height="14" fill="#efe6d2"/><ellipse cx="28" cy="52" rx="4" ry="7" fill="#ffd98f"/>
    <rect x="52" y="50" width="8" height="18" fill="#efe6d2"/><ellipse cx="56" cy="48" rx="4" ry="7" fill="#ffd98f"/>
    <rect x="80" y="50" width="8" height="18" fill="#efe6d2"/><ellipse cx="84" cy="48" rx="4" ry="7" fill="#ffd98f"/>
    <rect x="108" y="54" width="8" height="14" fill="#efe6d2"/><ellipse cx="112" cy="52" rx="4" ry="7" fill="#ffd98f"/>
  </g>
</svg>
