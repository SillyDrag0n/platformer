<svg xmlns="http://www.w3.org/2000/svg" width="220" height="96" viewBox="0 0 220 96">
  <!-- The ticket window. Left open at head height so the clerk behind it can be seen and talked
       to, the same way the bank's teller cage works. -->
  <rect x="0" y="0" width="220" height="10" fill="#8a5348"/>
  <rect x="6" y="10" width="60" height="54" fill="#3a201a"/>
  <rect x="154" y="10" width="60" height="54" fill="#3a201a"/>
  <rect x="10" y="14" width="52" height="46" fill="#5c332b"/>
  <rect x="158" y="14" width="52" height="46" fill="#5c332b"/>
  <g fill="#c9a227">
    <rect x="20" y="14" width="5" height="46"/><rect x="42" y="14" width="5" height="46"/>
    <rect x="168" y="14" width="5" height="46"/><rect x="190" y="14" width="5" height="46"/>
    <rect x="66" y="0" width="8" height="64"/><rect x="146" y="0" width="8" height="64"/>
    <rect x="74" y="10" width="72" height="6"/>
  </g>
  <rect x="74" y="54" width="72" height="10" fill="#8a5348"/>
  <rect x="94" y="56" width="32" height="6" fill="#c9a227"/>
  <rect x="0" y="64" width="220" height="10" fill="#8a5348"/>
  <rect x="4" y="74" width="212" height="22" fill="#5c332b"/>
  <g fill="#4a2a22">
    <rect x="60" y="74" width="6" height="22"/><rect x="154" y="74" width="6" height="22"/>
  </g>
  <rect x="0" y="92" width="220" height="4" fill="#3a201a"/>
</svg>
