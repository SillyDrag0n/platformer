<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="540" viewBox="0 0 1000 540">
  <!-- The post office. Game coords: x = sx - 500, y = sy - 270; floor surface at sy 400 (y 130).
       Plastered walls over a wood dado, and a sorting rail slung under the roof. -->
  <defs>
    <linearGradient id="roof" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1116"/>
      <stop offset="1" stop-color="#1c242c"/>
    </linearGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3dcab"/>
      <stop offset="1" stop-color="#d9a869"/>
    </linearGradient>
    <linearGradient id="wallFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141b21" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#141b21" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="floorFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1611" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#1a1611" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bottomFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#11140f" stop-opacity="0"/>
      <stop offset="1" stop-color="#11140f" stop-opacity="0.55"/>
    </linearGradient>
  </defs>

  <!-- roof void, tie beams and the sorting rail -->
  <rect x="0" y="0" width="1000" height="104" fill="url(#roof)"/>
  <rect x="0" y="60" width="1000" height="10" fill="#2b3138"/>
  <g fill="#39404a">
    <rect x="180" y="0" width="14" height="60"/><rect x="500" y="0" width="14" height="60"/>
    <rect x="820" y="0" width="14" height="60"/>
  </g>
  <g fill="#2f3742">
    <polygon points="180,18 290,60 270,60 180,28"/>
    <polygon points="194,18 84,60 104,60 194,28"/>
    <polygon points="500,18 610,60 590,60 500,28"/>
    <polygon points="514,18 404,60 424,60 514,28"/>
    <polygon points="820,18 930,60 910,60 820,28"/>
    <polygon points="834,18 724,60 744,60 834,28"/>
  </g>
  <rect x="0" y="96" width="1000" height="12" fill="#3d4650"/>
  <rect x="0" y="108" width="1000" height="6" fill="#59636e"/>

  <!-- plastered wall -->
  <rect x="0" y="114" width="1000" height="216" fill="#5b6d7c"/>
  <rect x="0" y="114" width="1000" height="60" fill="url(#wallFade)"/>
  <rect x="0" y="196" width="1000" height="4" fill="#526472"/>

  <!-- high windows -->
  <g>
    <rect x="120" y="140" width="96" height="72" fill="#33404a"/>
    <rect x="126" y="146" width="84" height="60" fill="url(#pane)"/>
    <rect x="164" y="146" width="8" height="60" fill="#33404a"/>
    <rect x="126" y="172" width="84" height="6" fill="#33404a"/>
    <rect x="784" y="140" width="96" height="72" fill="#33404a"/>
    <rect x="790" y="146" width="84" height="60" fill="url(#pane)"/>
    <rect x="828" y="146" width="8" height="60" fill="#33404a"/>
    <rect x="790" y="172" width="84" height="6" fill="#33404a"/>
  </g>

  <!-- painted sign band over the counter -->
  <rect x="360" y="140" width="280" height="46" fill="#2f4250"/>
  <rect x="366" y="146" width="268" height="34" fill="#43596a"/>
  <g fill="#e0c489">
    <rect x="392" y="156" width="10" height="14"/><rect x="410" y="156" width="10" height="14"/>
    <rect x="428" y="156" width="10" height="14"/><rect x="452" y="156" width="10" height="14"/>
    <rect x="470" y="156" width="10" height="14"/><rect x="488" y="156" width="10" height="14"/>
    <rect x="512" y="156" width="10" height="14"/><rect x="530" y="156" width="10" height="14"/>
    <rect x="548" y="156" width="10" height="14"/><rect x="572" y="156" width="10" height="14"/>
    <rect x="590" y="156" width="10" height="14"/>
  </g>

  <!-- wood dado -->
  <rect x="0" y="330" width="1000" height="8" fill="#7a5230"/>
  <rect x="0" y="338" width="1000" height="62" fill="#5c4630"/>
  <g fill="#4b3826">
    <rect x="60" y="338" width="5" height="62"/><rect x="160" y="338" width="5" height="62"/>
    <rect x="260" y="338" width="5" height="62"/><rect x="360" y="338" width="5" height="62"/>
    <rect x="460" y="338" width="5" height="62"/><rect x="560" y="338" width="5" height="62"/>
    <rect x="660" y="338" width="5" height="62"/><rect x="760" y="338" width="5" height="62"/>
    <rect x="860" y="338" width="5" height="62"/><rect x="960" y="338" width="5" height="62"/>
  </g>
  <rect x="0" y="392" width="1000" height="8" fill="#3a2b1c"/>

  <!-- plank floor -->
  <rect x="0" y="400" width="1000" height="140" fill="#6f5a3f"/>
  <rect x="0" y="400" width="1000" height="6" fill="#8a7150"/>
  <g fill="#59472f">
    <rect x="0" y="436" width="1000" height="4"/>
    <rect x="0" y="482" width="1000" height="4"/>
    <rect x="112" y="400" width="4" height="140"/><rect x="268" y="400" width="4" height="140"/>
    <rect x="430" y="400" width="4" height="140"/><rect x="592" y="400" width="4" height="140"/>
    <rect x="748" y="400" width="4" height="140"/><rect x="904" y="400" width="4" height="140"/>
  </g>
  <rect x="0" y="400" width="1000" height="32" fill="url(#floorFade)"/>
  <rect x="0" y="452" width="1000" height="88" fill="url(#bottomFade)"/>
</svg>
