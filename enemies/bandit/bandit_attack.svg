<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
  <!-- Firing. The empty holster is the clearest tell at this size that the iron is actually out. -->
  <g id="far-arm" transform="translate(0,0)">
    <rect x="22" y="26" width="4" height="9" fill="#5A3D26"/>
    <rect x="22" y="35" width="4" height="2" fill="#4A3021"/>
    <rect x="22" y="37" width="4" height="3" fill="#A8764F"/>
  </g>
  <g id="legs">
    <polygon points="17,41 23,41 26,57 20,57" fill="#2E2018"/>
    <rect x="19" y="57" width="10" height="5" fill="#1F1710"/>
    <polygon points="9,41 15,41 12,57 6,57" fill="#3A2A1E"/>
    <rect x="3" y="57" width="10" height="5" fill="#2A1E14"/>
  </g>
  <path d="M4 35 H27 L28 53 L23 50 L20 53 L16 50 L12 53 L8 50 L4 54 Z" fill="#6B4A2E"/>
  <path d="M20 35 H27 L28 53 L23 50 L20 53 Z" fill="#553A23"/>
  <g transform="translate(0,0)">
    <g id="torso">
      <rect x="6" y="24" width="20" height="14" fill="#7A5636"/>
      <rect x="21" y="24" width="5" height="14" fill="#5F4229"/>
      <rect x="10" y="24" width="12" height="2" fill="#5A3D26"/>
      <polygon points="12,26 18,26 16,34 14,34" fill="#C4AE84"/>
    </g>
    <g id="gunbelt">
      <rect x="6" y="38" width="20" height="3" fill="#4A3021"/>
      <rect x="12" y="38" width="4" height="3" fill="#C9A227"/>
      <rect x="4" y="41" width="6" height="8" fill="#4A3021"/>
      <rect x="5" y="42" width="4" height="5" fill="#2A1D14"/>
    </g>
    <g id="gun-arm">
      <rect x="5" y="25" width="7" height="6" fill="#6B4A2E"/>
      <rect x="3" y="24" width="6" height="5" fill="#6B4A2E"/>
      <rect x="3" y="24" width="1" height="5" fill="#4A3021"/>
      <rect x="2" y="24" width="3" height="4" fill="#C99368"/>
      <rect x="0" y="23" width="4" height="2" fill="#1C1C20"/>
      <rect x="3" y="23" width="2" height="3" fill="#3A3A42"/>
      <rect x="4" y="22" width="1" height="1" fill="#1C1C20"/>
      <polygon points="4,26 6,26 6,30 4,29" fill="#553A23"/>
    </g>
    <g id="neck">
      <rect x="13" y="20" width="6" height="4" fill="#A8764F"/>
    </g>
    <g id="head">
      <rect x="10" y="9" width="12" height="13" rx="1" fill="#C99368"/>
      <rect x="19" y="10" width="2" height="11" fill="#A8764F"/>
      <rect x="10" y="10" width="12" height="2" fill="#8A5C3C"/>
      <rect x="11" y="12" width="4" height="1" fill="#2A1D14"/>
      <rect x="17" y="11" width="4" height="1" fill="#2A1D14"/>
      <rect x="12" y="14" width="2" height="2" fill="#241A12"/>
      <rect x="18" y="14" width="2" height="2" fill="#241A12"/>
    </g>
    <g id="bandana">
      <polygon points="21,18 25,19 25,21 21,22" fill="#8E302A"/>
      <rect x="10" y="17" width="12" height="5" fill="#A63A32"/>
      <rect x="10" y="20" width="12" height="1" fill="#7E2A24"/>
    </g>
    <g id="hat">
      <ellipse cx="15" cy="9" rx="13" ry="2.4" fill="#3B2A1C"/>
      <polygon points="11,0 21,0 22,8 10,8" fill="#3B2A1C"/>
      <rect x="10" y="5" width="12" height="2" fill="#8B2E2E"/>
