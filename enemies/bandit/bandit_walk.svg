<svg xmlns="http://www.w3.org/2000/svg" width="32" height="64" viewBox="0 0 32 64">
  <!-- Mid-stride: a long step, the duster trailing behind it, and the whole upper body dropped a pixel so one frame still reads as a step rather than a slide. -->
  <g id="far-arm" transform="translate(0,1)">
    <rect x="22" y="26" width="4" height="9" fill="#5A3D26"/>
    <rect x="22" y="35" width="4" height="2" fill="#4A3021"/>
    <rect x="22" y="37" width="4" height="3" fill="#A8764F"/>
  </g>
  <g id="legs">
    <polygon points="17,41 23,41 27,55 21,57" fill="#2E2018"/>
    <rect x="21" y="55" width="10" height="5" fill="#1F1710"/>
    <polygon points="9,41 15,41 12,57 6,55" fill="#3A2A1E"/>
    <rect x="1" y="55" width="10" height="5" fill="#2A1E14"/>
  </g>
  <path d="M6 35 H26 L30 52 L25 51 L21 54 L16 51 L12 53 L7 51 Z" fill="#6B4A2E"/>
  <path d="M20 35 H26 L30 52 L25 51 L21 54 Z" fill="#553A23"/>
  <g transform="translate(0,1)">
    <g id="torso">
      <rect x="6" y="24" width="20" height="14" fill="#7A5636"/>
      <rect x="21" y="24" width="5" height="14" fill="#5F4229"/>
      <rect x="10" y="24" width="12" height="2" fill="#5A3D26"/>
      <polygon points="12,26 18,26 16,34 14,34" fill="#C4AE84"/>
    </g>
    <g id="gunbelt">
      <rect x="6" y="38" width="20" height="3" fill="#4A3021"/>
      <rect x="12" y="38" width="4" height="3" fill="#C9A227"/>
      <rect x="4" y="41" width="6" height="8" fill="#4A3021"/>
      <rect x="5" y="38" width="4" height="4" fill="#2A2A30"/>
    </g>
    <g id="near-arm">
      <rect x="3" y="26" width="5" height="6" fill="#6B4A2E"/>
      <rect x="3" y="32" width="5" height="2" fill="#4A3021"/>
      <rect x="2" y="34" width="5" height="4" fill="#C99368"/>
    </g>
    <g id="neck">
      <rect x="13" y="20" width="6" height="4" fill="#A8764F"/>
    </g>
    <g id="head">
      <rect x="10" y="9" width="12" height="13" rx="1" fill="#C99368"/>
      <rect x="19" y="10" width="2" height="11" fill="#A8764F"/>
      <rect x="10" y="10" width="12" height="2" fill="#8A5C3C"/>
      <rect x="12" y="13" width="2" height="2" fill="#241A12"/>
      <rect x="18" y="13" width="2" height="2" fill="#241A12"/>
    </g>
    <g id="bandana">
      <polygon points="21,18 25,19 25,21 21,22" fill="#8E302A"/>
      <rect x="10" y="17" width="12" height="5" fill="#A63A32"/>
      <rect x="10" y="20" width="12" height="1" fill="#7E2A24"/>
    </g>
    <g id="hat">
      <ellipse cx="15" cy="9" rx="13" ry="2.4" fill="#3B2A1C"/>
      <polygon points="11,0 21,0 22,8 10,8" fill="#3B2A1C"/>
      <rect x="10" y="5" width="12" height="2" fill="#8B2E2E"/>
      <rect x="11" y="0" width="2" height="8" fill="#4A3728"/>
